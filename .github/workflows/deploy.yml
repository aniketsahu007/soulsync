name: 🚀 Deploy SoulSync to Cloudflare Workers

on:
  push:
    branches:
      - main        # Auto-deploy on every push to main
  workflow_dispatch: # Also allow manual deploys from GitHub Actions tab

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout the code
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies
      - name: 📦 Install dependencies
        run: npm ci

      # 4. Build the TanStack Start app (SSR + assets)
      - name: 🏗️ Build app
        run: npm run build
        env:
          # Public vars needed at build time by Vite
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      # 5. Deploy to Cloudflare Workers via Wrangler
      - name: ☁️ Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
