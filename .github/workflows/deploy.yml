name: 🚀 Deploy SoulSync to Cloudflare Workers

on:
  push:
    branches:
      - main        # Auto-deploy on every push to main
  workflow_dispatch: # Also allow manual deploys from GitHub Actions tab

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout the code
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js (pin to 20 — matches engines field in package.json)
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # NOTE: No cache: 'npm' here — we delete package-lock.json below,
          # so the cache key would be stale and cause problems.

      # 3. Install dependencies
      # Root cause of previous failures: package-lock.json was generated on
      # Windows and is missing Linux-native binaries (rollup, sharp, etc.).
      # Deleting it forces npm to resolve correctly for linux/x64.
      - name: 📦 Install dependencies
        run: |
          rm -f package-lock.json
          npm install

      # 4. Build the TanStack Start SSR app
      - name: 🏗️ Build app
        run: npm run build
        env:
          # Public VITE_ vars needed at build time (baked into client bundle)
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      # 5. Deploy to Cloudflare Workers via Wrangler
      # Secrets (OPENROUTER_API_KEY, SUPABASE_SERVICE_ROLE_KEY, CRON_SECRET)
      # are already uploaded to Cloudflare via: wrangler secret put <NAME>
      - name: ☁️ Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
