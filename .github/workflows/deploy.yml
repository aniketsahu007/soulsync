name: 🚀 Deploy SoulSync to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Node 22 LTS (avoids Node 20 deprecation on GitHub Actions runners)
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Fresh install — delete Windows-generated lockfile so Linux
      #    resolves the correct native binaries (rollup, sharp, etc.)
      - name: 📦 Install dependencies
        run: |
          rm -f package-lock.json
          npm install

      # 4. Build the app first (TanStack Start / Vite)
      - name: 🏗️ Build app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          PROVIDER_1_NAME: groq
          PROVIDER_1_API_KEY: ${{ secrets.PROVIDER_1_API_KEY }}
          PROVIDER_1_BASE_URL: https://api.groq.com/openai/v1
          PROVIDER_1_MODEL: llama-3.3-70b-versatile
          PROVIDER_2_NAME: cerebras
          PROVIDER_2_API_KEY: ${{ secrets.PROVIDER_2_API_KEY }}
          PROVIDER_2_BASE_URL: https://api.cerebras.ai/v1
          PROVIDER_2_MODEL: gpt-oss-120b
          GROQ_API_KEY: ${{ secrets.PROVIDER_1_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile

      # 4b. Debug: show what the build produced
      - name: 🔍 List build output
        run: |
          echo "=== Root ===" && ls -la
          echo "=== .output (if exists) ===" && ls -la .output 2>/dev/null || echo "(no .output dir)"
          echo "=== dist (if exists) ===" && ls -la dist 2>/dev/null || echo "(no dist dir)"
          echo "=== .vinxi (if exists) ===" && ls -la .vinxi 2>/dev/null || echo "(no .vinxi dir)"

      # 5. Deploy to Cloudflare Workers
      # 5. Deploy to Cloudflare Workers via Wrangler
      # Using npx wrangler directly because cloudflare/wrangler-action installs
      # an outdated v3.x which fails silently with newer wrangler.jsonc configs.
      - name: ☁️ Deploy to Cloudflare Workers
        run: npx wrangler deploy --verbose --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          PROVIDER_1_NAME: groq
          PROVIDER_1_API_KEY: ${{ secrets.PROVIDER_1_API_KEY }}
          PROVIDER_1_BASE_URL: https://api.groq.com/openai/v1
          PROVIDER_1_MODEL: llama-3.3-70b-versatile
          PROVIDER_2_NAME: cerebras
          PROVIDER_2_API_KEY: ${{ secrets.PROVIDER_2_API_KEY }}
          PROVIDER_2_BASE_URL: https://api.cerebras.ai/v1
          PROVIDER_2_MODEL: gpt-oss-120b
          GROQ_API_KEY: ${{ secrets.PROVIDER_1_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile
